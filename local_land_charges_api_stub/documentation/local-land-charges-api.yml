openapi: 3.2.0
info:
  title: Local Land Charges stub
  description: |-
    Local Land Charges API stub. Replicates the functionality of the Local Land Charges API
    for external systems that allows authorised external services to Add, Amend and Retrieve
    Local Land Charges held by HM Land Registry.
  version: 1.0.0
# basePath: "/v1.0"
servers:
  - url: http://localhost:5000/v1.0
tags:
  - name: LLC
    description: Local Land Charges
paths:
  /local-land-charges:
    post:
      tags:
        - LLC
      summary: Add a new Local Land Charge to the Register
      description: Add a new Local Land Charge to the Register
      operationId: addLLC
      requestBody:
        $ref: '#/components/requestBodies/standardBody'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exampleResponses/response-201'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exampleResponses/response-400'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exampleResponses/response-500'
  /local-land-charges/{land-charge-id}:
    get:
      tags:
        - LLC
      summary: Retrieve Local Land Charge by ID
      description: Returns latest version of a Local Land Charge
      operationId: getLLCById
      parameters:
        - name: land-charge-id
          in: path
          description: ID of Local Land Charge to retrieve
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Search Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payloads/schemas/exampleGetBody'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
                    example: No land charges found
                  error_code:
                    type: number
                    example: 404
        '422':
          description: Invalid entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
                    example: Format of Land Charge ID is invalid
                  error_code:
                    type: number
                    example: 422
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exampleResponses/response-500'
  /local-land-charges/{land-charge-id}/{version-id}:
    put:
      tags:
        - LLC
      summary: Update an existing Local Land Charge
      description: 'Update an existing Local Land Charge'
      operationId: updateLLC
      parameters:
        - name: land-charge-id
          in: path
          description: ID of the Local Land Charge to amend
          required: true
          schema:
            type: string
        - name: version-id
          in: path
          description: Version ID of the Local Land Charge. Must be the latest version
            to be able to amend the charge
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        $ref: '#/components/requestBodies/standardBody'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exampleResponses/response-201'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exampleResponses/response-400'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exampleResponses/response-500'
    delete:
      tags:
        - LLC
      summary: Cancel an existing Local Land Charge
      description: 'Cancel an existing Local Land Charge'
      operationId: cancelLLC
      parameters:
        - name: land-charge-id
          in: path
          description: ID of the Local Land Charge to amend
          required: true
          schema:
            type: string
        - name: version-id
          in: path
          description: Version ID of the Local Land Charge. Must be the latest version
            to be able to amend the charge
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exampleResponses/response-201'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exampleResponses/response-400'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exampleResponses/response-500'
components:
  schemas:
    FeatureCollection:
      type: object
      description: GeoJSON FeatureCollection of the LLC extent
      properties:
        type:
          type: string
          example: FeatureCollection
        features:
          type: array
          items:
            enum:
            - $ref: "#/components/schemas/FeaturePolygon"
            - $ref: "#/components/schemas/FeatureLineString"
            - $ref: "#/components/schemas/FeaturePoint"
      example: {"type": "FeatureCollection", "features": [{"geometry": {"coordinates": [[[551687.69, 151241.91], [551689.71, 151242.06], [551692.31, 151241.8], [551697.69, 151241.7], [551719.25, 151241.28], [551719.19, 151247.5], [551719.12, 151260.5], [551718.88, 151278.0], [551712.69, 151278.09], [551711.61, 151299.79], [551681.08, 151299.79], [551681.62, 151297.5], [551683.69, 151279.7], [551688.12, 151261.09], [551687.69, 151241.91]]], "type": "Polygon"}, "properties": {"id": 1}, "type": "Feature"}, {"geometry": {"coordinates": [551698.67, 151253.67], "type": "Point"}, "properties": {"id": 2}, "type": "Feature"}]}
    FeaturePolygon:
      type: object
      properties:
        geometry:
          $ref: "#/components/schemas/GeometryPolygon"
        properties:
          type: object
          properties:
            id:
              type: integer
              example: 1
        type:
          type: string
          example: Feature
    FeatureLineString:
      type: object
      properties:
        geometry:
          $ref: "#/components/schemas/GeometryLineString"
        properties:
          type: object
          properties:
            id:
              type: integer
              example: 1
        type:
          type: string
          example: Feature
    FeaturePoint:
      type: object
      properties:
        geometry:
          $ref: "#/components/schemas/GeometryPoint"
        properties:
          type: object
          properties:
            id:
              type: integer
              example: 1
        type:
          type: string
          example: Feature
    Point2D:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: number
      example: "[123123,12312]"
    LineStringCoords:
      type: array
      minItems: 2
      items:
        $ref: "#/components/schemas/Point2D"
      example: "[[292752.66,93236.82],[292783.63,93235.1]]"
    PolygonCoords:
      type: array
      minItems: 1
      items:
        $ref: "#/components/schemas/PolygonCoordsList"
      example: "[[[292752.66,93236.82],[292783.63,93235.1],[292782.7,93216.24],[292752.12,93219.21],[292752.66,93236.82]]]"
    PolygonCoordsList:
      type: array
      minItems: 4
      items:
        $ref: "#/components/schemas/Point2D"
      example: "[[292752.66,93236.82],[292783.63,93235.1],[292782.7,93216.24],[292752.12,93219.21],[292752.66,93236.82]]"
    GeometryPolygon:
      type: object
      description: Polygon geometry
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          example: Polygon
        coordinates:
          type: array
          description: Coordinates for Polygon
          items:
            $ref: "#/components/schemas/PolygonCoords"
    GeometryLineString:
      type: object
      description: LineString geometry
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          example: LineString
        coordinates:
          type: array
          minItems: 2
          description: Coordinates for LineString
          items:
            $ref: "#/components/schemas/Point2D"
          example: "[[292752.66,93236.82],[292783.63,93235.1]]"
    GeometryPoint:
      type: object
      description: Point geometry
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          example: Point
        coordinates:
          type: array
          description: Coordinates for Point
          minItems: 2
          maxItems: 2
          items:
            type: number
          example: "[292752.66,93236.82]"
    registration-date:
      type: string
      description: Date the charge was added the register. Set by the LLC service when
        added to register and cannot be subsequently amended
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      format: date
      example: '2017-01-04'
    charge-type:
      description: The general category of the Charge (e.g. Planning, Financial)
      type: string
      example: Planning
      minLength: 1
    charge-sub-category:
      type: string
      description: The sub-category specific to the Charge type. Valid values of charge-type
        and charge-sub-category combinations can be found in /validation/categories.py
      example: Planning agreement
    charge-geographic-description:
      description: A description of the land affected by the Charge. Only one of charge-address
        or charge-geographic-description may be supplied.
      type: string
      minLength: 1
      maxLength: 1000
      example: 1 High Street, Exeter
    charge-address:
      description: Structured address of the land affected by the Charge. Only one of
        charge-address or charge-geographic-description may be supplied.
      type: object
      properties:
        line-1:
          type: string
        line-2:
          type: string
        line-3:
          type: string
        line-4:
          type: string
        line-5:
          type: string
        line-6:
          type: string
        postcode:
          type: string
          pattern: "^(([Gg][Ii][Rr] 0[Aa]{2})|((([A-Za-z][0-9]{1,2})|(([A-Za-z][A-Ha-hJ-Yj-y][0-9]{1,2})|(([A-Za-z][0-9][A-Za-z])|([A-Za-z][A-Ha-hJ-Yj-y][0-9]?[A-Za-z]))))(|
            [0-9][A-Za-z]{2})))$"
          example: SK1 6BH
        unique-property-reference-number:
          type: integer
      required:
      - line-1
      - postcode
      - unique-property-reference-number
      example: {"line-1": "Address line 1", "line-2": "Address line 2", "postcode": "AB1 2CD", "unique-property-reference-number": 123456}
    charge-creation-date:
      description: The date the Charge comes into effect
      type: string
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      format: date
      example: '2017-01-04'
    instrument:
      description: The document giving rise to the Charge. Valid values can be found
        in /validation/instruments.py
      type: string
      example: Deed
    statutory-provision:
      description: The statutory provision under which the Charge has arisen. Valid
        values can be found in /constants/constants.py
      type: string
      minLength: 1
      example: Planning Act 2008 section 205
    further-information-location:
      description: The location - physical or virtual - where relevant documents may
        be inspected
      type: string
      minLength: 1
      maxLength: 500
      example: 'Council Offices, Exeter'
    further-information-reference:
      description: The official reference of relevant documents
      type: string
      minLength: 1
      maxLength: 255
      example: 'REF: 123'
    land-works-particulars:
      description: Description of the reason why the land adjoining the retained land
        was compulsorily acquired. Valid only when 'charge-type' is 'Land compensation'
        and accompanied by 'land-sold-description'. Is a s8 Land compensation charge.
      type: string
      minLength: 1
      example: Building a new motorway
    land-sold-description:
      description: Description of the land sold by compulsory registration. Valid only
        when 'charge-type' is 'Land compensation' and accompanied by 'land-works-particulars'.
        Is a s8 Land compensation charge.
      type: string
      minLength: 1
      example: Land adjoining Buttercup Meadow, Plymouth
    land-capacity-description:
      description: A description of the capacity in which the land was acquired; e.g.
        freehold. Valid only when 'charge-type' is 'Land compensation' and accompanied
        by 'land-compensation-paid' and 'land-compensation-amount-type'. Is a s52 Land
        compensation charge.
      type: string
      minLength: 1
      example: Freehold, Leasehold or other
    land-compensation-paid:
      description: Amount already paid to the landowner from which the land was acquired.
        Valid only when 'charge-type' is 'Land compensation' and accompanied by 'land-capacity-description'
        and 'land-compensation-amount-type'. Is a s52 Land compensation charge.
      type: string
      minLength: 1
      example: '10000.00'
    land-compensation-amount-type:
      description: Valid only when 'charge-type' is 'Land compensation' is compensation
        paid Agreed or Estimated and accompanied by 'land-capacity-descriptiom' and
        'land-compensation-paid'. Is a s52 Land compensation charge.
      type: string
      enum:
      - Agreed amount
      - Estimated amount
    originating-authority:
      description: The name of the Minister of the Crown, government department, local
        authority or other person by whom the charge is brought into existence.
      type: string
      minLength: 1
      example: Exeter City Council
    expiry-date:
      description: The date on which a Land Interest in respect of a local land charge
        ceases to exist.
      type: string
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      format: date
      example: '2017-01-04'
    amount-originally-secured:
      description: The financial amount secured at the time the charge was created.
        Valid only when 'charge-type' is 'Financial' and 'rate-of-interest' is included.
      type: string
      minLength: 1
      example: 1000
    rate-of-interest:
      description: The rate of interest as a percentage payable on the amount secured,
        or 'Interest may be payable' or 'No interest is payable'. Valid only when 'charge-type'
        is 'Financial' and 'amount-originally-secured' is included.
      type: string
      minLength: 1
      example: 5.5
    amount-of-compensation:
      description: The total amount of compensation payable to the landowner from which
        the land was acquired. Valid only when 'charge-type' is 'Land compensation'
      type: string
      minLength: 1
      example: '1000000.00'
    end-date:
      description: The date on which Local Land Charge record is cancelled
      type: string
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      format: date
      example: '2017-01-04'
    cancellation-reason:
      description: Reason why charge has been cancelled
      type: string
      minLength: 1
      maxLength: 1500
    version-id:
      type: number
      description: ID which distingiushes each version of a charge during its lifecycle
        of changes
      example: 4443
      min: 1
    supplementary-information:
      type: string
      description: Other information relating to the charge
      minLength: 1
      maxLength: 1500
      example: Application to vary condition 47 of planning permission reference number
        123/123 dated 26.08.2011, enabling the addition of a split basement level
    schema-version:
      type: string
      description: The current version of the schema
      minLength: 1
      example: '5.0'
    payloads:
      schemas:
        exampleGetBody:
          type: object
          properties:
            item:
              $ref: '#/components/schemas/payloads/schemas/exampleBodyFinancial'
            version-id:
              $ref: '#/components/schemas/version-id'
        exampleBody:
          type: object
          properties:
            item:
              type: object
              description: Example of a standard charge, has charge-address instead of charge-geographic-description
              properties:
                charge-type:
                  $ref: '#/components/schemas/charge-type'
                charge-sub-category:
                  "$ref": "#/components/schemas/charge-sub-category"
                charge-address:
                  "$ref": "#/components/schemas/charge-address"
                registration-date:
                  "$ref": "#/components/schemas/registration-date"
                charge-creation-date:
                  "$ref": "#/components/schemas/charge-creation-date"
                instrument:
                  "$ref": "#/components/schemas/instrument"
                statutory-provision:
                  "$ref": "#/components/schemas/statutory-provision"
                further-information-location:
                  "$ref": "#/components/schemas/further-information-location"
                further-information-reference:
                  "$ref": "#/components/schemas/further-information-reference"
                originating-authority:
                  "$ref": "#/components/schemas/originating-authority"
                expiry-date:
                  "$ref": "#/components/schemas/expiry-date"
                supplementary-information:
                  "$ref": "#/components/schemas/supplementary-information"
                geometry:
                  "$ref": "#/components/schemas/FeatureCollection"
        exampleBodyFinancial:
          type: object
          properties:
            item:
              type: object
              properties:
                charge-type:
                  $ref: '#/components/schemas/charge-type'
                charge-sub-category:
                  "$ref": "#/components/schemas/charge-sub-category"
                charge-geographic-description:
                  "$ref": "#/components/schemas/charge-address"
                registration-date:
                  "$ref": "#/components/schemas/registration-date"
                charge-creation-date:
                  "$ref": "#/components/schemas/charge-creation-date"
                instrument:
                  "$ref": "#/components/schemas/instrument"
                statutory-provision:
                  "$ref": "#/components/schemas/statutory-provision"
                further-information-location:
                  "$ref": "#/components/schemas/further-information-location"
                further-information-reference:
                  "$ref": "#/components/schemas/further-information-reference"
                originating-authority:
                  "$ref": "#/components/schemas/originating-authority"
                expiry-date:
                  "$ref": "#/components/schemas/expiry-date"
                supplementary-information:
                  "$ref": "#/components/schemas/supplementary-information"
                amount-originally-secured:
                  "$ref": "#/components/schemas/amount-originally-secured"
                rate-of-interest:
                  "$ref": "#/components/schemas/rate-of-interest"
                geometry:
                  "$ref": "#/components/schemas/FeatureCollection"
    exampleResponses:
      response-201:
        type: object
        properties:
          version-id:
            type: string
          land-charge-id:
            type: string
          registration-date:
            type: string
      response-400:
        type: object
        properties:
          error_message:
            type: array
            items:
              type: object
              properties:
                error:
                  type: string
                details:
                  type: array
                  items:
                    type: object
                    properties:
                      error_message:
                        type: string
                      location:
                        description: The location of the erroring attribute in
                          the JSON. '$.' is the object root
                        type: string
          error_code:
            type: string
      response-500:
        type: object
        properties:
          error_message:
            type: string
          error_code:
            type: string
  requestBodies:
    standardBody:
      description: A standard charge example
      required: true
      content:
        application/json:
          schema:
            anyOf:
             - $ref: '#/components/schemas/payloads/schemas/exampleBody'
             - $ref: '#/components/schemas/payloads/schemas/exampleBodyFinancial'
